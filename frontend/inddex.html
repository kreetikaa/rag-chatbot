<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DocMind — RAG Chatbot</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #0d0d1a;
  --bg2: #13131f;
  --bg3: #1a1a2e;
  --pink: #ff2d78;
  --pink-soft: rgba(255,45,120,0.12);
  --blue: #3b82f6;
  --blue-soft: rgba(59,130,246,0.12);
  --text: #f0f0ff;
  --muted: #6b6b8a;
  --border: rgba(255,255,255,0.07);
}

body {
  font-family: 'Space Grotesk', sans-serif;
  background: var(--bg);
  color: var(--text);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  background: var(--bg2);
  border-bottom: 1px solid var(--border);
  padding: 16px 28px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  font-size: 20px;
  font-weight: 600;
  background: linear-gradient(90deg, var(--pink), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

#sessionBadge {
  font-size: 11px;
  padding: 4px 12px;
  border-radius: 99px;
  border: 1px solid var(--border);
  color: var(--muted);
  background: var(--bg3);
}

.app {
  display: flex;
  flex: 1;
  overflow: hidden;
}

/* Sidebar */
.sidebar {
  width: 270px;
  background: var(--bg2);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px;
  gap: 16px;
}

.sidebar-label {
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  font-weight: 500;
}

.drop-zone {
  border: 1.5px dashed rgba(255,45,120,0.3);
  border-radius: 12px;
  padding: 24px 16px;
  text-align: center;
  cursor: pointer;
  position: relative;
  transition: all 0.2s;
  background: var(--pink-soft);
  color: var(--muted);
  font-size: 13px;
}

.drop-zone:hover {
  border-color: var(--pink);
  color: var(--pink);
}

.drop-zone input {
  position: absolute;
  inset: 0;
  opacity: 0;
  cursor: pointer;
  width: 100%;
  height: 100%;
}

.drop-icon { font-size: 28px; margin-bottom: 8px; }

#uploadStatus {
  font-size: 12px;
  padding: 8px 12px;
  border-radius: 8px;
  background: var(--blue-soft);
  color: var(--blue);
  border: 1px solid rgba(59,130,246,0.2);
  display: none;
}

#fileList { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; }

.file-item {
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 10px 12px;
}

.file-name { font-size: 13px; font-weight: 500; color: var(--text); }
.file-meta { font-size: 11px; color: var(--muted); margin-top: 3px; }

.stats {
  display: flex;
  gap: 12px;
  border-top: 1px solid var(--border);
  padding-top: 16px;
}

.stat { flex: 1; text-align: center; }
.stat-num {
  font-size: 24px;
  font-weight: 600;
  background: linear-gradient(90deg, var(--pink), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

/* Chat */
.chat-area {
  flex: 1;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: var(--bg);
}

#messages {
  flex: 1;
  overflow-y: auto;
  padding: 28px;
  display: flex;
  flex-direction: column;
  gap: 20px;
}

#messages::-webkit-scrollbar { width: 4px; }
#messages::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

.empty-state {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  text-align: center;
  color: var(--muted);
}

.empty-icon { font-size: 52px; }

.empty-title {
  font-size: 22px;
  font-weight: 600;
  background: linear-gradient(90deg, var(--pink), var(--blue));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}

.empty-sub { font-size: 14px; max-width: 300px; line-height: 1.6; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 4px; }

.chip {
  font-size: 12px;
  padding: 6px 16px;
  border-radius: 99px;
  border: 1px solid var(--border);
  background: var(--bg2);
  color: var(--muted);
  cursor: pointer;
  transition: all 0.15s;
  font-family: 'Space Grotesk', sans-serif;
}

.chip:hover { border-color: var(--pink); color: var(--pink); }

/* Messages */
.message { display: flex; gap: 12px; max-width: 800px; }
.message.user { align-self: flex-end; flex-direction: row-reverse; }

.avatar {
  width: 32px; height: 32px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  flex-shrink: 0;
}

.user .avatar {
  background: linear-gradient(135deg, var(--pink), #ff6b6b);
  color: white;
  font-size: 11px;
}

.bot .avatar {
  background: linear-gradient(135deg, var(--blue), #6366f1);
  color: white;
}

.bubble {
  padding: 12px 18px;
  border-radius: 16px;
  font-size: 14px;
  line-height: 1.7;
  max-width: 620px;
}

.user .bubble {
  background: linear-gradient(135deg, var(--pink), #c2185b);
  color: white;
  border-bottom-right-radius: 4px;
}

.bot .bubble {
  background: var(--bg2);
  border: 1px solid var(--border);
  border-bottom-left-radius: 4px;
  color: var(--text);
}

.sources {
  margin-top: 10px;
  padding-top: 10px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
}

.source-tag {
  font-size: 11px;
  padding: 3px 8px;
  border-radius: 4px;
  background: var(--blue-soft);
  color: var(--blue);
  border: 1px solid rgba(59,130,246,0.2);
}

.thinking { display: flex; gap: 5px; align-items: center; padding: 4px 0; }
.thinking span {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--blue);
  animation: bounce 1.2s infinite;
}
.thinking span:nth-child(2) { animation-delay: 0.2s; }
.thinking span:nth-child(3) { animation-delay: 0.4s; }

@keyframes bounce {
  0%,80%,100% { transform: scale(0.6); opacity: 0.3; }
  40% { transform: scale(1); opacity: 1; }
}

/* Input */
.input-bar {
  padding: 16px 28px;
  border-top: 1px solid var(--border);
  background: var(--bg2);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.input-wrap {
  display: flex;
  align-items: flex-end;
  gap: 10px;
  background: var(--bg3);
  border: 1px solid var(--border);
  border-radius: 14px;
  padding: 10px 14px;
  transition: border-color 0.2s;
}

.input-wrap:focus-within { border-color: var(--pink); }

textarea {
  flex: 1;
  font-family: 'Space Grotesk', sans-serif;
  font-size: 14px;
  border: none;
  outline: none;
  background: transparent;
  resize: none;
  max-height: 120px;
  min-height: 24px;
  line-height: 1.5;
  color: var(--text);
}

textarea::placeholder { color: var(--muted); }

.send-btn {
  width: 36px; height: 36px;
  border-radius: 10px;
  border: none;
  background: linear-gradient(135deg, var(--pink), var(--blue));
  color: white;
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.15s;
  flex-shrink: 0;
}

.send-btn:hover { opacity: 0.85; transform: scale(1.05); }
.send-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

.hint { font-size: 11px; color: var(--muted); text-align: center; }

.toast {
  position: fixed;
  bottom: 20px; right: 20px;
  padding: 10px 18px;
  border-radius: 8px;
  font-size: 13px;
  opacity: 0;
  transform: translateY(8px);
  transition: all 0.2s;
  pointer-events: none;
  z-index: 999;
  background: var(--bg3);
  border: 1px solid var(--border);
  color: var(--text);
}
.toast.show { opacity: 1; transform: translateY(0); }
.toast.error { border-color: var(--pink); color: var(--pink); }
</style>
</head>
<body>

<header>
  <div class="logo">⚡ DocMind</div>
  <div id="sessionBadge">connecting...</div>
</header>

<div class="app">
  <aside class="sidebar">
    <div class="sidebar-label">Upload Documents</div>
    <div class="drop-zone">
      <input type="file" id="fileInput" accept=".pdf,.txt,.md" multiple>
      <div class="drop-icon">📄</div>
      Drop PDF or TXT here<br>or click to browse
    </div>
    <div id="uploadStatus"></div>
    <div id="fileList"></div>
    <div class="stats">
      <div class="stat">
        <div class="stat-num" id="statFiles">0</div>
        <div class="stat-label">Files</div>
      </div>
      <div class="stat">
        <div class="stat-num" id="statChunks">0</div>
        <div class="stat-label">Chunks</div>
      </div>
    </div>
  </aside>

  <main class="chat-area">
    <div id="messages">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🧠</div>
        <div class="empty-title">Chat with your documents</div>
        <div class="empty-sub">Upload a PDF or text file on the left, then ask any question about it.</div>
        <div class="chips">
          <div class="chip" onclick="fillQ('Summarise this document')">Summarise this document</div>
          <div class="chip" onclick="fillQ('What are the key points?')">Key points</div>
          <div class="chip" onclick="fillQ('What topics does this cover?')">Topics covered</div>
        </div>
      </div>
    </div>
    <div class="input-bar">
      <div class="input-wrap">
        <textarea id="questionInput" rows="1"
          placeholder="Ask anything about your documents..."
          onkeydown="handleKey(event)"
          oninput="autoResize(this)"></textarea>
        <button class="send-btn" id="sendBtn" onclick="sendMessage()" disabled>↑</button>
      </div>
      <div class="hint">Enter to send · Shift+Enter for new line</div>
    </div>
  </main>
</div>

<div class="toast" id="toast"></div>

<script>
const API = 'http://localhost:8000';
let sessionId = null;
let fileCount = 0;
let totalChunks = 0;

async function init() {
  try {
    const res = await fetch(`${API}/session/create`, { method: 'POST' });
    const data = await res.json();
    sessionId = data.session_id;
    document.getElementById('sessionBadge').textContent = `session: ${sessionId}`;
  } catch(e) {
    showToast('Cannot connect to backend!', true);
  }
}

document.getElementById('fileInput').addEventListener('change', function() {
  uploadFiles(this.files);
});

async function uploadFiles(files) {
  if (!sessionId) return showToast('Not connected!', true);
  for (const file of files) await uploadOne(file);
}

async function uploadOne(file) {
  const status = document.getElementById('uploadStatus');
  status.style.display = 'block';
  status.textContent = `⏳ Processing ${file.name}...`;

  const form = new FormData();
  form.append('file', file);

  try {
    const res = await fetch(`${API}/upload/${sessionId}`, { method: 'POST', body: form });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);

    fileCount++;
    totalChunks = data.total_chunks;
    document.getElementById('statFiles').textContent = fileCount;
    document.getElementById('statChunks').textContent = totalChunks;

    const list = document.getElementById('fileList');
    const item = document.createElement('div');
    item.className = 'file-item';
    item.innerHTML = `<div class="file-name">📄 ${file.name}</div><div class="file-meta">${data.chunks_created} chunks indexed</div>`;
    list.appendChild(item);

    document.getElementById('sendBtn').disabled = false;
    status.textContent = `✅ ${file.name} ready!`;
    showToast(`${file.name} indexed!`);
    setTimeout(() => status.style.display = 'none', 3000);
  } catch(e) {
    status.textContent = `❌ ${e.message}`;
    showToast(e.message, true);
  }
}

async function sendMessage() {
  const input = document.getElementById('questionInput');
  const question = input.value.trim();
  if (!question) return;

  input.value = '';
  input.style.height = 'auto';
  document.getElementById('sendBtn').disabled = true;
  document.getElementById('emptyState')?.remove();

  addMessage('user', question);
  const thinkId = addThinking();

  try {
    const res = await fetch(`${API}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ session_id: sessionId, question }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.detail);
    removeThinking(thinkId);
    addMessage('bot', data.answer, data.sources);
  } catch(e) {
    removeThinking(thinkId);
    addMessage('bot', '⚠️ ' + e.message);
  } finally {
    document.getElementById('sendBtn').disabled = false;
  }
}

function addMessage(role, text, sources = []) {
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const sourcesHtml = sources.length
    ? `<div class="sources">${sources.map(s => `<span class="source-tag">📎 ${s}</span>`).join('')}</div>`
    : '';
  div.innerHTML = `
    <div class="avatar">${role === 'user' ? 'You' : '🧠'}</div>
    <div class="bubble">${text.replace(/\n/g,'<br>')}${sourcesHtml}</div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
}

function addThinking() {
  const id = 'think-' + Date.now();
  const msgs = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'message bot';
  div.id = id;
  div.innerHTML = `<div class="avatar">🧠</div><div class="bubble"><div class="thinking"><span></span><span></span><span></span></div></div>`;
  msgs.appendChild(div);
  msgs.scrollTop = msgs.scrollHeight;
  return id;
}

function removeThinking(id) { document.getElementById(id)?.remove(); }
function fillQ(q) { document.getElementById('questionInput').value = q; }
function handleKey(e) { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); } }
function autoResize(el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 120) + 'px'; }
function showToast(msg, isError = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show' + (isError ? ' error' : '');
  setTimeout(() => t.className = 'toast', 3500);
}

init();
</script>
</body>
</html>
